# docker compose up --build                       -> app on http://localhost:8080 and API docs on http://localhost:8000/docs
# docker compose --profile monitoring up --build  -> adds Prometheus (9090) and Grafana (3000)
# docker compose --profile tracking up            -> adds the MLflow UI (5000)

services:
  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    image: review-sentiment-api:latest
    ports: ["8000:8000"]
    environment:
      SENTIMENT_CORS_ORIGINS: '["http://localhost:8080","http://localhost:5173"]'
    volumes:
      - prediction-logs:/app/logs
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
    image: review-sentiment-web:latest
    ports: ["8080:80"]
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.5.0
    profiles: [monitoring]
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports: ["9090:9090"]

  grafana:
    image: grafana/grafana:12.0.0
    profiles: [monitoring]
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    ports: ["3000:3000"]
    depends_on: [prometheus]

  mlflow:
    image: python:3.13-slim-trixie
    profiles: [tracking]
    # Same MLflow version as the training client so the tracking schema always matches.
    command: >
      sh -c "pip install --no-cache-dir mlflow==3.17.2 &&
             mlflow server --host 0.0.0.0 --port 5000
             --backend-store-uri sqlite:////mlflow/mlflow.db --artifacts-destination /mlflow/mlartifacts"
    volumes:
      - ./mlflow-store:/mlflow
    ports: ["5000:5000"]

volumes:
  prediction-logs:
