name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Lint and test API + training code
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa # v10.3.1
        with:
          enable-cache: true
          python-version: "3.13"
      - run: uv sync --locked --all-extras
      - name: Ruff
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: Pytest
        env:
          SENTIMENT_LOG_PREDICTIONS: "false"
        run: uv run pytest --cov=sentiment_mlops --cov-report=term-missing

  model-gate:
    name: Retrain on fixture and enforce the quality gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa # v10.3.1
        with:
          enable-cache: true
          python-version: "3.13"
      - run: uv sync --locked --all-extras
      - name: Smoke-train on the committed 3k-row fixture
        run: uv run python -m sentiment_mlops.train --data tests/fixtures/sample_reviews.csv --sample-size 0 --no-mlflow --skip-gate --out-dir /tmp/ci-train
      - name: Check the committed production model still passes the gate
        run: |
          uv run python - <<'PY'
          import json, yaml, sys
          meta = json.load(open("models/model_meta.json"))
          gate = yaml.safe_load(open("params.yaml"))["quality_gate"]
          m = meta["metrics"]
          ok = m["macro_f1"] >= gate["min_test_macro_f1"] and m["negative_recall"] >= gate["min_test_negative_recall"]
          print(json.dumps(m, indent=2)); sys.exit(0 if ok else 1)
          PY

  frontend:
    name: Typecheck and build frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build

  docker:
    name: Build images
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/api.Dockerfile
          tags: review-sentiment-api:ci
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Container smoke test
        run: |
          docker run -d --name api -p 8000:8000 review-sentiment-api:ci
          for i in $(seq 1 30); do curl -sf localhost:8000/health && break; sleep 1; done
          curl -sf -X POST localhost:8000/v1/predict -H 'content-type: application/json' \
            -d '{"text":"Stopped working after a week"}' | tee /dev/stderr | grep -q negative
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/frontend.Dockerfile
          tags: review-sentiment-web:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
