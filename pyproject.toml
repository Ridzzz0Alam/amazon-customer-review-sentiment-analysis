[project]
name = "review-sentiment-mlops"
version = "1.0.0"
description = "Customer review sentiment classifier with training pipeline, experiment tracking and a FastAPI service"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.162.0",
    "joblib>=1.6.0",
    "numpy>=2.5",
    "pandas>=3.0",
    "prometheus-fastapi-instrumentator>=8.1.0",
    "pydantic>=2.14",
    "pydantic-settings>=2.16",
    "pyyaml>=6.0",
    "scikit-learn==1.9.1",
]

[project.optional-dependencies]
train = [
    "mlflow>=3.17",
    "dvc>=3.67",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2",
    "pytest-cov>=7.0",
    "ruff>=0.17",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sentiment_mlops"]

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src", "tests"]
# The original notebook project (generator scripts, notebook and its README) predates
# these lint rules and is not part of the MLOps package, so it is left out of CI linting.
extend-exclude = [
    "*.ipynb",
    "README.md",
    "build_notebook.py",
    "colab_cells.py",
    "markdown_text.py",
    "notebook_cells.py",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
